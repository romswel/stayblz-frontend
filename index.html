<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#eef2f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stayblz" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="no-referrer" />
    <link rel="stylesheet" href="/startup.css" />
    <script>
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("stayblz.theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0d2318" : "#eef2f9");
      })();
    </script>
    <title>Stayblz</title>
    <meta
      name="description"
      content="Know the horse. Read the race. Racecards, results, workouts, your racing notebook, and Stayblz Chat."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..800;1,400..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <div
        class="sb-startup"
        role="status"
        aria-live="polite"
        aria-label="Loading Stayblz"
      >
        <div class="sb-startup-content">
          <div class="sb-startup-mark">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M24 3 42 10v15c0 10-10 17-18 20C16 42 6 35 6 25V10L24 3Z" stroke="currentColor" stroke-width="1.4" />
              <path d="M15 34c1-8 6-9 8-14l-7 3-2-3 8-7 1-5 5 5c7 4 9 12 8 21H15Z" fill="currentColor" />
              <path d="m25 14 5 4-4 3M13 38h23" stroke="#142820" stroke-width="1.5" />
              <circle cx="24.5" cy="16.5" r="1" fill="#142820" />
            </svg>
          </div>
          <strong class="sb-startup-name">STAYBLZ<span>.</span></strong>
          <span class="sb-startup-ledger">THE RACING LEDGER</span>
          <div class="sb-startup-line" aria-hidden="true"></div>
          <p class="sb-startup-message">Getting things ready…</p>
          <noscript>Enable JavaScript to open Stayblz.</noscript>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
